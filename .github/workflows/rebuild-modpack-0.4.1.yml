name: Rebuild Modpack 0.4.1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - tools/rebuild_modpack.py
      - .github/workflows/rebuild-modpack-0.4.1.yml
      - oar_combat_package/reference/input_modpack_manifest/**

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild current CurseForge pack
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          python tools/rebuild_modpack.py \
            --base oar_combat_package/reference/input_modpack_manifest/os_aventureiros_reforged_twilight_edition_neoforge_1.21.1.zip \
            --output build/Os_Aventureiros_Reforged_Twilight_Edition_0.4.1_Gobber_NeoForge_1.21.1.zip

      - name: Generate checksum
        run: |
          cd build
          sha256sum Os_Aventureiros_Reforged_Twilight_Edition_0.4.1_Gobber_NeoForge_1.21.1.zip > Os_Aventureiros_Reforged_Twilight_Edition_0.4.1_Gobber_NeoForge_1.21.1.zip.sha256

      - name: Upload rebuilt modpack
        uses: actions/upload-artifact@v4
        with:
          name: oar-modpack-0.4.1
          path: |
            build/Os_Aventureiros_Reforged_Twilight_Edition_0.4.1_Gobber_NeoForge_1.21.1.zip
            build/Os_Aventureiros_Reforged_Twilight_Edition_0.4.1_Gobber_NeoForge_1.21.1.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oar-modpack-0.4.1-failure-report
          path: build/rebuild-failure.json
          if-no-files-found: ignore
          retention-days: 14
